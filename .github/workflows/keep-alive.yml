name: Render keep-alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Render health
        env:
          RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          test -n "$RENDER_HEALTH_URL"
          curl --fail --silent --show-error --max-time 30 "$RENDER_HEALTH_URL"
